name: Test Crawler Sources (News + LinkedIn)

# Manual-only. Tests the news (#1B) and LinkedIn (#1C) crawlers and prints results
# to the workflow log. Does not write to DB, does not call Claude, does not send email.

on:
  workflow_dispatch:
    inputs:
      competitor_name:
        description: 'Optional: test a single arbitrary name (e.g. "Slack"). If set, business_id is ignored.'
        required: false
        type: string
      linkedin_url:
        description: 'Optional (with competitor_name): override LinkedIn URL — tests the direct-fetch path. Ignored in DB mode.'
        required: false
        type: string
      business_id:
        description: 'Optional: UUID of a business to restrict DB mode to. If competitor_name and business_id are both blank, tests all active competitors across all businesses.'
        required: false
        type: string
      only:
        description: 'Optional: restrict to a single source.'
        required: false
        type: choice
        options:
          - both
          - news
          - linkedin
        default: both

jobs:
  test-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler test
        env:
          # Only required when no competitor_name is supplied (DB mode)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # The crawler module imports config, which expects these but doesn't validate
          # for this script — set dummies so import succeeds.
          CLAUDE_API_KEY: "not-used-in-this-test"
          RESEND_API_KEY: "not-used-in-this-test"
          LOG_LEVEL: INFO
        run: |
          set -e
          NAME="${{ github.event.inputs.competitor_name }}"
          LI_URL="${{ github.event.inputs.linkedin_url }}"
          BUSINESS_ID="${{ github.event.inputs.business_id }}"
          ONLY="${{ github.event.inputs.only }}"

          ARGS=()
          if [ -n "$NAME" ]; then
            ARGS+=("$NAME")
            if [ -n "$LI_URL" ]; then
              ARGS+=(--linkedin-url "$LI_URL")
            fi
          elif [ -n "$BUSINESS_ID" ]; then
            ARGS+=(--business-id "$BUSINESS_ID")
          fi

          if [ "$ONLY" = "news" ] || [ "$ONLY" = "linkedin" ]; then
            ARGS+=(--only "$ONLY")
          fi

          python -m scripts.test_crawler "${ARGS[@]}"
