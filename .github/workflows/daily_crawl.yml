name: Daily Competitive Research Crawl

on:
  schedule:
    # Every day at 3:00 AM UTC (8:00 AM PKT)
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual triggering
    inputs:
      business_id:
        description: 'Optional: specific business ID to crawl (leave empty for all)'
        required: false
        type: string

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run daily crawl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: "Competitive Intel"
          LOG_LEVEL: INFO
        run: |
          if [ -z "${{ github.event.inputs.business_id }}" ]; then
            python -m src.scheduler --all
          else
            python -m src.scheduler --business-id "${{ github.event.inputs.business_id }}"
          fi

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-logs
          path: logs/
          retention-days: 7
